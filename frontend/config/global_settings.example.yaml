# Safe, non-secret reference for frontend/config/global_settings.yaml.
# Gateway creates the private runtime file automatically; this example is not loaded.
python:
  executable: python
llm:
  modelLibrary:
    - id: default-model
      name: example-provider
      model: your-model-name
      baseUrl: https://api.example.com/v1
      apiKey: "" # Set the real key only in the local UI/private settings file.
      thinkingMode: default
      reasoningEffort: default
      maxTokens: 32768
      contextWindowTokens: 131072
  roleModels:
    autoRealize: default-model
    autoMlCode: default-model
    autoMlFeedback: default-model
    promptOptimizer: default-model
    embedding: ""
  vllm:
    enabled: true
coreServices:
  autoRealizeBaseUrl: http://127.0.0.1:18101
  algoEvolveBaseUrl: http://127.0.0.1:18103
  autoReportBaseUrl: http://127.0.0.1:18104
  requestTimeoutSecs: 10
algoevolve:
  torchHubDir: ""
  pretrainModelDir: ""
  embeddingBaseUrl: ""
  embeddingApiKey: ""
  embeddingModel: ""
